name: sarai
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  cloud_firestore: ^5.4.0
  firebase_auth: ^5.2.0
  firebase_core: ^3.4.0
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.1
  pinput: ^5.0.0
  shared_preferences: ^2.2.3
  github_signin_promax: ^0.0.8+1
  flutter_secure_storage: ^9.2.2
  email_otp: ^2.0.1
  twilio_flutter: ^0.0.9
  firebase_database: ^11.1.1
  water_drop_nav_bar: ^2.2.2
  image_picker: ^1.1.2
  flutter_dotenv: ^5.0.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.9.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/icon.png"
